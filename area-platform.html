<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Area AI — Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--bg2:#f3f1eb;--bg3:#eceae2;
  --white:#fff;--black:#0e0e08;
  --border:#dedad0;--border2:#ccc8bc;--border3:#b8b4a6;
  --text:#19190f;--text2:#48483a;--text3:#78786a;--text4:#a8a89a;--text5:#c8c8ba;
  --accent:#c8773a;
  --green:#2d7a4f;--green-bg:#f0faf4;--green-bdr:#b8dfc8;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bdr:#bfdbfe;
  --font:"DM Sans","Helvetica Neue",sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
  --mono:"JetBrains Mono","SF Mono",monospace;
  --sw:232px;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ── APP SHELL ── */
#app {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sb {
  width: var(--sw);
  min-width: var(--sw);
  height: 100vh;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  transition: width .22s ease, min-width .22s ease;
  z-index: 100;
}

/* Sidebar top / logo */
.sb-top {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  cursor: default;
}
.sb-logo-name {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.04em;
  color: var(--text);
}
.sb-collapse {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text3);
  flex-shrink: 0;
  transition: background .12s, color .12s;
}
.sb-collapse:hover { background: var(--bg2); color: var(--text); }

/* Active workspace pill */
.sb-ws {
  padding: 8px 12px;
  margin: 10px 8px 4px;
  border-radius: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: default;
  flex-shrink: 0;
}
.sb-ws-icon {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--text);
  color: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.sb-ws-info { flex: 1; min-width: 0; }
.sb-ws-name {
  font-size: 13px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-ws-sub { font-size: 11px; color: var(--text4); }

/* Section labels + nav items */
.sb-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 12px;
}
.sb-scroll::-webkit-scrollbar { width: 4px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.sb-section { padding: 16px 8px 4px; flex-shrink: 0; }
.sb-lbl {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text4);
  padding: 0 10px;
  margin-bottom: 4px;
  display: block;
}

/* Nav item */
.ni {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7.5px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  color: var(--text2);
  cursor: pointer;
  transition: background .11s, color .11s;
  margin-bottom: 1px;
  position: relative;
  white-space: nowrap;
  overflow: hidden;
  user-select: none;
}
.ni:hover { background: var(--bg2); color: var(--text); }
.ni.active {
  background: var(--bg2);
  color: var(--text);
  font-weight: 500;
}
.ni.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  background: var(--text);
  border-radius: 0 2px 2px 0;
}
.ni svg {
  opacity: .5;
  flex-shrink: 0;
  transition: opacity .12s;
}
.ni.active svg, .ni:hover svg { opacity: .85; }

.ni-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

.ni-badge {
  margin-left: auto;
  font-size: 10.5px; font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.ni-badge-b { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-bdr); }
.ni-badge-g { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bdr); }

/* Sidebar footer */
.sb-footer {
  border-top: 1px solid var(--border);
  padding: 10px 8px;
  flex-shrink: 0;
}
.sb-footer-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 13px; color: var(--text3);
  cursor: default;
}
.sb-footer-item svg { opacity: .5; flex-shrink: 0; }

/* ── CONTENT AREA ── */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-width: 0;
}

/* Page frame */
.page-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.page-wrap iframe {
  flex: 1;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* Loading state */
.frame-loading {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 50;
  transition: opacity .25s;
}
.frame-loading.hide {
  opacity: 0;
  pointer-events: none;
}
.loader-ring {
  width: 30px; height: 30px;
  border: 2.5px solid var(--border);
  border-top-color: var(--text2);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-lbl {
  font-size: 12.5px;
  color: var(--text4);
  font-weight: 400;
}

/* Collapsed sidebar */
.sb.collapsed {
  width: 52px;
  min-width: 52px;
}
.sb.collapsed .sb-logo-name,
.sb.collapsed .sb-ws-info,
.sb.collapsed .sb-lbl,
.sb.collapsed .ni-label,
.sb.collapsed .ni-badge,
.sb.collapsed .sb-ws-name,
.sb.collapsed .sb-ws-sub,
.sb.collapsed .sb-footer-item span {
  display: none;
}
.sb.collapsed .sb-ws {
  justify-content: center;
  padding: 8px;
}
.sb.collapsed .ni {
  justify-content: center;
  padding: 9px;
}
.sb.collapsed .ni.active::before {
  display: none;
}
.sb.collapsed .ni svg {
  opacity: .7;
}
.sb.collapsed .ni.active svg {
  opacity: 1;
}
.sb.collapsed .sb-footer-item {
  justify-content: center;
  padding: 9px;
}
.sb.collapsed .sb-section {
  padding: 12px 4px 4px;
}

/* ── MOBILE OVERLAY ── */
.sb-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.3);
  z-index: 99;
  backdrop-filter: blur(2px);
}
@media (max-width: 768px) {
  .sb {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform .22s ease, width .22s ease;
    width: var(--sw) !important;
    min-width: var(--sw) !important;
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  .sb.mobile-open {
    transform: translateX(0);
  }
  .sb-overlay.active { display: block; }
  .mobile-menu-btn { display: flex !important; }
  /* Show all labels in mobile open state */
  .sb.collapsed .sb-logo-name,
  .sb.collapsed .sb-ws-info,
  .sb.collapsed .sb-lbl,
  .sb.collapsed .ni-label,
  .sb.collapsed .ni-badge,
  .sb.collapsed .sb-ws-name,
  .sb.collapsed .sb-ws-sub {
    display: block;
  }
}

/* Mobile topbar */
.mobile-topbar {
  display: none;
  height: 52px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
}
.mobile-menu-btn {
  display: none;
  width: 32px; height: 32px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: transparent;
  align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text2);
}
.mobile-page-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.01em;
}
@media (max-width: 768px) {
  .mobile-topbar { display: flex; }
  .content-area { overflow: hidden; }
}
</style>
</head>

const loaded = {};
let currentPage = "home";

/* Decode base64 → html string */
function b64decode(b64) {
  const bstr = atob(b64);
  const bytes = new Uint8Array(bstr.length);
  for (let i = 0; i < bstr.length; i++) bytes[i] = bstr.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

/* Load page into iframe using blob URL */
function loadPage(tid) {
  if (loaded[tid]) return;
  loaded[tid] = true;

  const iframe = document.getElementById("iframe-" + tid);
  const html = b64decode(PAGES[tid]);
  const blob = new Blob([html], {type: "text/html; charset=utf-8"});
  const url = URL.createObjectURL(blob);

  iframe.onload = function() {
    /* Intercept internal navigation links */
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      interceptLinks(doc, iframe.contentWindow);
    } catch(e) {}
    /* Hide loader once this page is done */
    if (tid === currentPage) hideLoader();
  };
  iframe.src = url;
}

    "console.html":  "console",
    "playground":    "playground",
    "404":           "err404",
    "blog.html":     "home",
  };

  doc.addEventListener("click", function(e) {
    const el = e.target.closest("a");
    if (!el) return;
    const href = (el.getAttribute("href") || "").toLowerCase();
    if (!href || href.startsWith("http") || href.startsWith("#") || href.startsWith("mailto")) return;
    for (const [key, pid] of Object.entries(MAP)) {
      if (href.includes(key.toLowerCase())) {
        e.preventDefault();
        switchPage(pid);
        return;
      }
    }
  }, true);

  /* Also intercept window.location.href assignments */
  try {
    win.location.href; /* test access */
    const origAssign = win.location.assign.bind(win.location);
    Object.defineProperty(win.location, "href", {
      set(v) {
        const MAP2 = {
          "index.html":"home","pricing.html":"pricing","about.html":"about",
          "console.html":"console","area-console":"console",
          "area-main.html":"docs","playground":"playground","404":"err404"
        };
        for (const [k,p] of Object.entries(MAP2)) {
          if (v && v.includes(k)) { switchPage(p); return; }
        }
        origAssign(v);
      },
      get() { return win.location.href; }
    });
  } catch(e) {}
}

/* Show / hide loader */
function showLoader(label) {
  const l = document.getElementById("global-loader");
  document.getElementById("loader-lbl").textContent = "Loading " + label + "…";
  l.classList.remove("hide");
}
function hideLoader() {
  document.getElementById("global-loader").classList.add("hide");
}

/* Switch active page */
function switchPage(tid) {
  if (!document.getElementById("frame-" + tid)) return;

  currentPage = tid;
  
  /* Hide all page frames */
  document.querySelectorAll(".page-wrap").forEach(el => el.style.display = "none");
  /* Deactivate all nav items */
  document.querySelectorAll(".ni").forEach(el => el.classList.remove("active"));

  /* Show the requested frame */
  const frame = document.getElementById("frame-" + tid);
  frame.style.display = "flex";

  /* Mark nav item active */
  const nav = document.getElementById("nav-" + tid);
  if (nav) nav.classList.add("active");

  /* Update mobile title */
  const titleEl = document.getElementById("mobile-page-title");
  if (titleEl) titleEl.textContent = PAGE_LABELS[tid] || tid;

  /* Load if not already */
  if (!loaded[tid]) {
    showLoader(PAGE_LABELS[tid] || tid);
    loadPage(tid);
  } else {
    hideLoader();
  }

  /* Close mobile sidebar */
  closeMobileSidebar();

  /* Persist */
  try { sessionStorage.setItem("area-page", tid); } catch(e) {}
}

/* Sidebar collapse/expand */
let sidebarCollapsed = false;
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById("sidebar").classList.toggle("collapsed", sidebarCollapsed);
}

/* Mobile sidebar */
function toggleMobileSidebar() {
  const sb = document.getElementById("sidebar");
  const overlay = document.getElementById("sb-overlay");
  const isOpen = sb.classList.contains("mobile-open");
  sb.classList.toggle("mobile-open", !isOpen);
  overlay.classList.toggle("active", !isOpen);
}
function closeMobileSidebar() {
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sb-overlay").classList.remove("active");
}

/* Init */
(function() {
  const saved = (function() { try { return sessionStorage.getItem("area-page"); } catch(e) { return null; } })();
  const initPage = (saved && document.getElementById("frame-" + saved)) ? saved : "home";
  
  /* Preload home immediately */
  loadPage("home");
  switchPage(initPage);

  /* Lazy-load remaining pages */
  const order = ["docs","pricing","about","console","playground","err404"];
  let i = 0;
  function loadNext() {
    if (i < order.length) {
      const t = order[i++];
      if (!loaded[t]) loadPage(t);
      setTimeout(loadNext, 400);
    }
  }
  setTimeout(loadNext, 800);
})();
</script>
